# SonarQube 分析配置。
# 注意：令牌绝不能写入本文件（会被提交），请通过 SONAR_TOKEN 环境变量传入。
sonar.projectKey=deepseek-harness-desktop
sonar.projectName=DeepSeek Harness Desktop
sonar.host.url=https://so.rclandy.com
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.mjs

sonar.exclusions=dist/**,node_modules/**,.cache/**,src/assets/**,coverage/**

# 由 npm run test:coverage 生成（Node 内置 test runner 的 lcov reporter）。
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.javascript.node.maxspace=2048
# 分析后等待服务端计算，并让门禁失败的退出码直接暴露出来。
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
