name: Package and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without a leading v; must match package.json"
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: deepseek-harness-desktop-release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - id: release
        name: Validate release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
            [[ "$REF_NAME" == "v$version" ]]
          else
            version="$DISPATCH_VERSION"
          fi
          node -e 'if (!require("semver").valid(process.argv[1])) process.exit(1)' "$version"
          [[ "$version" == "$package_version" ]] || {
            echo "Requested version $version does not match package.json $package_version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macOS Apple Silicon
            args: --mac --arm64
          - runner: macos-15-intel
            name: macOS Intel
            args: --mac --x64
          - runner: windows-2025
            name: Windows x64
            args: --win --x64
          - runner: ubuntu-24.04
            name: Linux x64
            args: --linux --x64
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build native packages
        run: npm run dist -- ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null | sort > SHA256SUMS.txt
      - name: Create update manifest
        run: |
          node scripts/create-release-manifest.mjs \
            --input "$RUNNER_TEMP/release-assets" \
            --output "$RUNNER_TEMP/release-assets/latest.json" \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY"
      - name: Create release and upload assets
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DeepSeek Harness Desktop $TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/release-assets/"* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          {
            echo "## DeepSeek Harness Desktop $TAG"
            echo
            echo "[GitHub Release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
